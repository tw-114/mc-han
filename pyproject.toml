[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-han"
version = "0.6.1"
description = "Minecraft modpack localization assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "mc-han contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
release = ["pyinstaller>=6.21"]

[project.scripts]
mc-han = "mc_han.cli:main"
mc-han-gui = "mc_han.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_han = ["data/*.yaml", "data/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
